[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awgit"
version = "1.1.2"
description = "Aither World-Graph git — semantic version control on top of git: edit-ops keyed on stable node ids, content-addressed bodies, differential sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

# OPTIONAL on purpose. Python node identity is native (CPython's ast); repowise
# adds identity for the other 20+ languages it parses. Making it a hard
# dependency would drag a large third-party parser into every install of a tool
# whose core does not need it — and awgit must still import, and still guard
# Python, when it is absent (see awgit/repowise_parser.available()).
[project.optional-dependencies]
multilang = ["repowise>=0.31.0"]
# `awgit data diff` reads CSV/TSV with the stdlib and needs nothing. Parquet
# needs pyarrow, which is tens of megabytes — an order of magnitude more than
# the rest of this package — so it stays opt-in. The README advertises exactly
# this name; an advertised extra that does not exist is a `pip install` that
# fails on a stranger's machine.
tabular = ["pyarrow>=15.0.0"]

[project.scripts]
awgit = "awgit.cli:main"

[tool.setuptools]
packages = ["awgit"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
awgit = ["hooks/chain.sh", "hooks/*.d/*"]
