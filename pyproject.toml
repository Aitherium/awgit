[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awgit"
version = "1.3.0"
description = "Aither World-Graph git — semantic version control on top of git: edit-ops keyed on stable node ids, content-addressed bodies, differential sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

# Matches the pattern already live on awrelay/awgraph/awdk's PyPI pages.
# Measured 2026-08-19: this package's PyPI listing had `project_urls: None` —
# a stranger who `pip install`s it has no link to source, docs or the issue
# tracker at all.
[project.urls]
Homepage = "https://github.com/Aitherium/awgit"
Documentation = "https://aitherium.github.io/awgit/"
Repository = "https://github.com/Aitherium/awgit.git"
Issues = "https://github.com/Aitherium/awgit/issues"

# OPTIONAL on purpose. Python node identity is native (CPython's ast); repowise
# adds identity for the other 20+ languages it parses. Making it a hard
# dependency would drag a large third-party parser into every install of a tool
# whose core does not need it — and awgit must still import, and still guard
# Python, when it is absent (see awgit/repowise_parser.available()).
[project.optional-dependencies]
multilang = ["repowise>=0.31.0"]

[project.scripts]
awgit = "awgit.cli:main"

[tool.setuptools]
packages = ["awgit"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
awgit = ["hooks/chain.sh", "hooks/*.d/*"]
