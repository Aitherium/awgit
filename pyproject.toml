[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awgit"
version = "0.1.0"
description = "Aither World-Graph git — semantic version control on top of git: edit-ops keyed on stable node ids, content-addressed bodies, differential sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

[project.scripts]
awgit = "awgit.cli:main"

[tool.setuptools]
packages = ["awgit"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
awgit = ["hooks/chain.sh", "hooks/*.d/*"]
